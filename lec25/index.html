<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
        .box{
            height:400px;
            width: 400px;
            background-color: beige;
            border:2px solid black;
            /* transition-property:all;
            transition-duration:4s;
            transition-delay:1s;
            transition-timing-function:linear; */
            transition:all 2s 5s ease-in;
        }
        .box:hover{
            /* pehle 400px ka dabba tha jaise hi hover kia 1200px ka bn gya */
            width:1200px;
            height: 900px;
            /* transition property all pe mtlb width aur bg color dono pe apply krdi h */
            background-color: blue;
        }
    </style>
</head>
<body>
    <div class="box">

    </div>
</body>
</html>
